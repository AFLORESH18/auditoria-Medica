<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría Médica | Protocolos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #064e3b;
            --accent-green: #10b981;
            --medical-blue: #2563eb;
            --bg-body: #f3f4f6;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            background: var(--white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            body { align-items: flex-start; }
            .dashboard { height: auto; min-height: 100vh; border-radius: 0; }
        }

        .login-screen {
            position: absolute;
            inset: 0;
            background: var(--primary-green);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .input-name {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
        }

        header {
            height: 60px;
            background: var(--primary-green);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; overflow: visible; }
        }

        .case-sidebar {
            width: 40%;
            background: linear-gradient(180deg, #065f46 0%, #064e3b 100%);
            color: white;
            padding: 30px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .case-sidebar { width: 100%; overflow-y: visible; padding: 20px; }
        }

        .case-tag {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        .options-area {
            width: 60%;
            padding: 30px;
            overflow-y: auto;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .options-area { width: 100%; overflow-y: visible; padding: 20px 20px 100px 20px; }
        }

        .option-card {
            background: white;
            border: 2px solid #f3f4f6;
            padding: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-card.selected { border: 2px solid var(--medical-blue); background: #f0f7ff; }
        .option-card.correct-key { border-left: 6px solid var(--accent-green) !important; }

        .feedback {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
        }
        .feedback.error { background: #fee2e2; color: #991b1b; }
        .feedback.success { background: #dcfce7; color: #166534; }

        footer {
            height: 70px;
            padding: 0 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            footer { position: fixed; bottom: 0; width: 100%; z-index: 500; }
        }

        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
        .btn-primary { background: var(--accent-green); color: white; width: 100%; }
        .btn-next { background: var(--medical-blue); color: white; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="dashboard">
    <div id="loginOverlay" class="login-screen">
        <div class="login-box">
            <h2 style="color:var(--primary-green)">Auditoría Clínica</h2>
            <input type="text" id="docInput" class="input-name" placeholder="Nombre completo" onkeypress="if(event.key==='Enter') startApp()">
            <button class="btn btn-primary" onclick="startApp()">ACCEDER</button>
        </div>
    </div>

    <header>
        <h1 id="mobileTitle">AUDIT PROTOCOL</h1>
        <div id="headerDoc">MÉDICO: ---</div>
    </header>

    <div class="main-container">
        <div class="case-sidebar">
            <div id="caseCounter" class="case-tag">CASO 1 DE 6</div>
            <div class="case-content">
                <h3 id="caseText" style="font-size: 1.1rem; margin-bottom: 15px;">Cargando...</h3>
                <div class="question-highlight" id="questionText" style="font-size: 0.95rem;">Cargando...</div>
            </div>
        </div>
        <div class="options-area" id="optionsContainer"></div>
    </div>

    <footer>
        <button id="nextBtn" class="btn btn-next" onclick="nextSlide()">Siguiente Caso →</button>
        <button id="finishBtn" class="btn btn-next" onclick="enviarYFinalizar()" style="background: var(--primary-green);">Guardar Auditoría</button>
    </footer>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUBKWH6DH36A_Y-cDDI_X264g5ghZ4t_4S425E4tj-HyS0Qzfxv65UaDRVcWboRirXvQ/exec"; 

    let historialRespuestas = [];
    let contadorCorrectas = 0;
    let contadorIncorrectas = 0;
    let current = 0;
    let selectedFirst = false;

    const banco = [
        {
            caso: "Paciente varon de 30 años refiere dolor abdominal, fue atendido el dia de ayer en clínica, se realizo toma de analitica y ecografia, brindando el alta con dignostico de gastroenteritis. Se comunica con servicio de ambulancia por persistencia de síntomas.",
            pregunta: "¿Cuál debería ser mi accionar?",
            opciones: [
                { t: "a) Brindar medicacion sintomatica (analgésicos) y recomendar seguir medicación.", fb: "Error. El paciente es trasladado luego de 6rs a clinica por apendicitis complicada. recordar Politica N° 15...", ok: false },
                { t: "b) Recomendar dieta blanda y comunicarse nuevamente si persisten los sintomas .", fb: "Error. El paciente es trasladado luego de 6rs a clinica por apendicitis complicada. recordar Politica N° 15...", ok: false },
                { t: "c) Evaluación médica e indicar traslado a Clínica.", fb: "Correcto. recordar Politica N° 15...", ok: true }
            ],
            correctas: [2]
        },
        {
            caso: "Paciente mujer de 30 años refiere ser alérgica a AINES pero tolera el Metamizol. presenta temperatura de 38°C y dolor de garganta. Al Examen físico Murmullo vesicular en ambos campos pulmonares, no ruidos agregados. Orofaringe: no presencia de tumoraciones.",
            pregunta: "¿Qué acciones se tomarían?",
            opciones: [
                { t: "a) Se indica Metamizol 500mg por via intramuscular ( Dosis reducida) + Paracetamol 500mg por via oral .", fb: "Crítico. … Paciente presenta angioedema...", ok: false },
                { t: "b) Se indica 02 tabletas de Paracetamol, uso de medios fisicos en caso de persistir las molestias comunicarse nuevamente..", fb: "Correcto. … considerar que no presente signos de alarma...", ok: true },
                { t: "c) Se indica traslado a Clinica para continuar evalucion y tratamiento.", fb: "Correcto .. Considerar en pacientes que refieren ya tomaron medicacion antipiretica...", ok: true }
            ],
            correctas: [1, 2]
        },
        {
            caso: "Se recibe llamada para atencion en madrugada aproximadamente a las 03:40hrs Paciente varon de 55 años, refiere presenta cefalea asociada a mareos que iniciaron aproximadamente hace 3 horas, niega antecedentes previos.",
            pregunta: "¿Que acciones realizariamos?",
            opciones: [
                { t: "a) Se indica Dimenhidrinato 50mg por via endovenosa, se indica a paciente comunicarse nuevamente en caso sintomas persistan.", fb: "Grave. … se confirma ACV Cerebelar...", ok: false },
                { t: "b) Se indica traslado a Clinica para evaluacion por area de emergencia.", fb: "Correcto - se tiene un signo de alerta critico...", ok: true },
                { t: "c) Se indica analgesico ketorolaco 30mg por via endovenosa + dimenhidrinato 50mg por via endovenosa...", fb: "Grave. … se confirma ACV Cerebelar...", ok: false }
            ],
            correctas: [1]
        },
        {
            caso: "Se recibe llamada para atencion de paciente mujer de 40 años con antecedentes de hipertension, Niega alergias, refiere dolor en articulacion, niega contusion, no caidas.",
            pregunta: "¿Que indicaciones brindaria?",
            opciones: [
                { t: "a) Se indica Diclofenaco 75mg por via intramuscular, se indica a paciente comunicarse nuevamente en caso sintomas persistan", fb: "Correcto. … recordar politica N°4", ok: true },
                { t: "b) Se indica traslado a Clinica..", fb: " … paciente acude a clinica donde es dada de alta luego de 30 minutos...", ok: false },
                { t: "c) Se indica Orfenadrina 60mg por via intramuscular...", fb: "… recordar que nuestra historia clinica debe tener congruencia...", ok: false }
            ],
            correctas: [0]
        },
        {
            caso: "Paciente varon de 60 años con antecedente de hipertension se encuentra en la playa y refiere consumo de ceviche y tomo alcohol en poca cantidad, presenta dolor en epigastrio.",
            pregunta: "¿Qué tratamiento brindaría?",
            opciones: [
                { t: "a) Se indica omeprazol 20mg por via endovenosa y hioscina 20mg EV...", fb: " ... Paciente fallece por infarto al miocardio ... Recordar politica N° 5", ok: false },
                { t: "b) Se indica traslado a Clinica por diagnostico de Dolor abdominal a D/C Gastritis", fb: "… se hace evidente un infarto al miocardio...", ok: false },
                { t: "c) Se indica traslado a Clinica con otro diagnostico asociado", fb: ".. Correcto e el diagnostico mas probable es : Infarto al miocardio...", ok: true }
            ],
            correctas: [2]
        },
        {
            caso: "Paciente mujer de 35 años presenta dolor abdominal en epigastrio que inicia hace 24hrs tipo ardor, irradiado hacia region lumbar. Refiere que siempre le colocan 3 medicamentos.",
            pregunta: "¿Qué tratamiento brindaría?",
            opciones: [
                { t: "a) Se indica Metamizol 1gr + omeprazol 20mg + hioscina 20mg EV diluido en 1 jeringa de 20cc...", fb: " ... Diagnostico de pancreatitis y tromboflebitis con necrosis local...", ok: false },
                { t: "b) Se indica hioscina 20mg y Dimenhidrinato 50mg EV y volver a comunicarse...", fb: "… se recuerda que toda politica es en beneficio del paciente...", ok: false },
                { t: "c) Se indica hioscina 20mg y Dimenhidrinato 50mg EV y traslado a Clinica", fb: ".. Correcto y el diagnostico mas probable es : Pancreatitis aguda...", ok: true }
            ],
            correctas: [2]
        }
    ];

    function startApp() {
        const input = document.getElementById('docInput');
        if(!input || !input.value.trim()) return alert("Ingrese su nombre");
        
        document.getElementById('headerDoc').innerText = "MÉDICO: " + input.value.toUpperCase();
        document.getElementById('loginOverlay').style.display = 'none';
        renderSlide();
    }

    function renderSlide() {
        selectedFirst = false;
        const q = banco[current];
        document.getElementById('caseCounter').innerText = `CASO ${current + 1} DE ${banco.length}`;
        document.getElementById('caseText').innerText = q.caso;
        document.getElementById('questionText').innerText = q.pregunta;
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('finishBtn').style.display = 'none';
        
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        
        q.opciones.forEach((opt, i) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.id = `card-${i}`;
            card.innerHTML = `<div style="font-weight:600; font-size:0.9rem;">${opt.t}</div><div id="fb-${i}" class="feedback"></div>`;
            card.onclick = function() { showFeedback(i); };
            container.appendChild(card);
        });
        window.scrollTo(0, 0);
    }

    function showFeedback(idx) {
        if (selectedFirst) return; 
        
        const q = banco[current];
        const opt = q.opciones[idx];
        const fbDiv = document.getElementById(`fb-${idx}`);
        
        selectedFirst = true;
        fbDiv.innerText = opt.fb;
        fbDiv.style.display = 'block';
        fbDiv.className = 'feedback ' + (opt.ok ? 'success' : 'error');
        
        document.getElementById(`card-${idx}`).classList.add('selected');
        historialRespuestas.push(opt.t);
        
        if(opt.ok) { contadorCorrectas++; } else { contadorIncorrectas++; }
        
        q.correctas.forEach(cIdx => {
            document.getElementById(`card-${cIdx}`).classList.add('correct-key');
        });

        if(current < banco.length - 1) { 
            document.getElementById('nextBtn').style.display = 'block'; 
        } else { 
            document.getElementById('finishBtn').style.display = 'block'; 
        }
    }

    function nextSlide() { 
        current++; 
        renderSlide(); 
    }

    function enviarYFinalizar() {
        const payload = {
            medico: document.getElementById('headerDoc').innerText,
            respuestas: historialRespuestas,
            correctas: contadorCorrectas,
            incorrectas: contadorIncorrectas
        };
        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
        document.querySelector('.dashboard').innerHTML = `
            <div style="padding:60px 20px; text-align:center;">
                <h1 style="color:var(--primary-green)">¡Completado!</h1>
                <p>Auditoría enviada correctamente.</p>
                <br><button class="btn btn-primary" onclick="location.reload()">Nuevo Registro</button>
            </div>
        `;
    }
</script>

</body>
</html>
